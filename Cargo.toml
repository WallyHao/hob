# --- hob manifest ---
# Scriptable CLI for the AI chores of a single developer.

[package]
name = "hob"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A lightweight, scriptable CLI for AI chores"
license = "MIT"
keywords = ["cli", "lua", "ai", "automation"]
categories = ["command-line-utilities"]

[lib]
name = "hob"
path = "src/lib.rs"

[[bin]]
name = "hob"
path = "src/main.rs"

[profile.release]
# The binary is the distribution artifact, so it is built small and stripped;
# the size gate in `just budget` holds this profile to a number.
codegen-units = 1
lto = true
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic rules dropped for reasons that would otherwise repeat everywhere.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
