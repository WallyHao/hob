# --- hob manifest ---
# Scriptable CLI for the AI chores of a single developer.

[package]
name = "hob"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A lightweight, scriptable CLI for AI chores"
license = "MIT"
readme = "README.md"
keywords = ["cli", "lua", "ai", "automation"]
categories = ["command-line-utilities"]

[lib]
name = "hob"
path = "src/lib.rs"

[[bin]]
name = "hob"
path = "src/main.rs"

[[bench]]
name = "startup"
harness = false

[dependencies]
mlua = { version = "0.12.1", default-features = false, features = ["lua54", "vendored"] }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "signal"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
iai-callgrind = "0.16.1"
stats_alloc = "0.1.10"
wiremock = "0.6.5"

[profile.release]
# The binary is the distribution artifact, so it is built small and stripped;
# the size gate in `just budget` holds this profile to a number.
codegen-units = 1
lto = true
panic = "abort"
strip = true

[profile.bench]
# iai-callgrind toggles callgrind collection on a wrapper function it generates
# around each benchmark; LTO inlines that wrapper away and `strip` removes the
# symbols valgrind matches, either of which makes every benchmark report zero
# instructions. The bench profile must not inherit those release settings.
lto = false
strip = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic rules dropped for reasons that would otherwise repeat everywhere.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
